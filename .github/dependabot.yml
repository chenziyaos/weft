# Minor and patch updates arrive as one grouped pull request per ecosystem.
# Major updates are not opened automatically: they need a manual migration
# (for example vite 8 together with @vitejs/plugin-react 6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 7.1 turns on React Compiler rules that flag 28 existing call sites;
      # upgrading it is a code change, not a dependency bump.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
