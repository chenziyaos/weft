# Minor and patch updates arrive as one grouped pull request per ecosystem.
# Major updates are not opened automatically: they need a manual migration
# (for example vite 8 together with @vitejs/plugin-react 6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # rehype-katex renders with its own katex ^0.16; the top-level copy
      # only supplies the stylesheet and must stay on the same minor.
      - dependency-name: katex
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # cli/Dockerfile pins node:22-bookworm-slim by digest; this keeps the digest current.
  - package-ecosystem: docker
    directory: /cli
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
