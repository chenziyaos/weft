name: Bug report
description: Something in Weft does not work as documented.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run server && npm run dev
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Canvas in the browser
        - weft CLI
        - Skill / live canvas bridge
        - Session mirror (Claude Code, Codex, DeepSeek Harness, Pi)
        - Desktop shell
        - Docs or website
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version, browser, and the commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Proxy output, browser console errors. Remove API keys and private conversation content first.
      render: text
