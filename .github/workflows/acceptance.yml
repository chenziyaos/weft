# The browser acceptance scripts that need no model, nightly on Linux with the
# runner's Google Chrome. ci.yml stays fast (lint, build, unit tests); this is
# where the real server, the built page and the packaged CLI are driven
# end to end. VERIFICATION.md lists what each script checks and which scripts
# need live models and are not run here.
name: acceptance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/acceptance.yml'
      - 'scripts/verify-*.mjs'

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script:
          - verify-cli-package
          - verify-install-release
          - verify-byo
          - verify-context-visible
          - verify-replay-plan
          - verify-tool-outputs
          - verify-local-atlas
          - verify-canvas-bridge
          - verify-multi-agent
          - verify-workspace-cli
          - verify-workspace-ui
          - verify-hydration-ui
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run cli:build && npm run host:build
      - name: Run ${{ matrix.script }}
        run: |
          if [ "${{ matrix.script }}" = verify-cli-package ]; then
            npm run cli:pack
            set -- "cli/weft-canvas-$(node -p "require('./cli/package.json').version").tgz"
          fi
          node "scripts/${{ matrix.script }}.mjs" "$@"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.script }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
