name: Deploy website and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - ".github/workflows/product-story-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weft-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Desktop releases are tagged v<version>; cli-v* releases carry only the npm CLI.
      - name: Resolve latest desktop release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api 'repos/${{ github.repository }}/releases?per_page=30' --jq '[.[] | select(.tag_name | test("^v[0-9]"))][0].tag_name // empty')" >> "$GITHUB_OUTPUT"

      - name: Build website and documentation
        env:
          WEFT_RELEASE: ${{ steps.release.outputs.tag }}
        run: npm run website:build

      - name: Check pages and discovery metadata
        run: npm run website:check

      - name: Upload website and documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
